<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin | Star Pets</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#241f4d;--side:#2b2566;--gold:#f0b429;--bg:#f6f4fb;--card:#fff;--line:#e4e0f0;--mute:#6b6790;--ok:#1f9d6b;--bad:#d64545}
*{box-sizing:border-box}
body{margin:0;font-family:'Figtree',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,.brand{font-family:'Fredoka',Georgia,serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hidden{display:none!important}
.btn{background:var(--gold);color:var(--ink);border:0;border-radius:8px;padding:.6rem 1rem;font-weight:700}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad);font-weight:500}
.btn.sm{padding:.3rem .6rem;font-size:.85rem}
label{display:block;font-size:.85rem;color:var(--mute);margin:.8rem 0 .25rem}
input,select,textarea{width:100%;padding:.6rem .7rem;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
/* login */
#login{min-height:100vh;display:grid;place-items:center;background:var(--side)}
#login form{background:var(--card);padding:2rem;border-radius:14px;width:min(360px,92vw)}
#login .brand{font-size:1.8rem;margin:0 0 .2rem}
.err{color:var(--bad);font-size:.9rem;min-height:1.2rem;margin:.6rem 0 0}
/* app */
#app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--side);color:#fff;padding:1.4rem 1rem;display:flex;flex-direction:column;gap:.3rem}
aside .brand{font-size:1.4rem;margin:0 0 1.2rem;color:var(--gold)}
aside button.nav{background:none;border:0;color:#cfcaf5;text-align:left;padding:.65rem .8rem;border-radius:8px}
aside button.nav.on{background:rgba(255,255,255,.12);color:#fff;font-weight:700}
aside .spacer{flex:1}
aside small{color:#a9a3dc;word-break:break-all}
main{padding:1.6rem 2rem;min-width:0}
main h2{margin:0 0 1.2rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:1.5rem}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem 1.2rem}
.stat b{display:block;font-size:1.8rem;font-family:'Fredoka',serif}
.stat span{color:var(--mute);font-size:.9rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem 1.2rem;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th{text-align:left;font-size:.85rem;color:var(--mute);font-weight:500;padding:.5rem .6rem;border-bottom:1px solid var(--line)}
td{padding:.65rem .6rem;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td img{width:40px;height:40px;border-radius:8px;object-fit:cover;background:var(--bg);vertical-align:middle;margin-right:.6rem}
.tag{display:inline-block;padding:.15rem .55rem;border-radius:99px;font-size:.8rem;background:var(--bg)}
.tag.off{background:#fde8e8;color:var(--bad)}
.low{color:var(--bad);font-weight:700}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;gap:1rem;flex-wrap:wrap}
.empty{color:var(--mute);padding:1.5rem;text-align:center}
/* modal */
dialog{border:0;border-radius:14px;padding:1.5rem;width:min(480px,94vw)}
dialog::backdrop{background:rgba(36,31,77,.5)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.actions{display:flex;justify-content:flex-end;gap:.6rem;margin-top:1.2rem}
#toast{position:fixed;bottom:1.2rem;right:1.2rem;background:var(--ink);color:#fff;padding:.7rem 1rem;border-radius:8px}
@media(max-width:760px){#app{grid-template-columns:1fr}aside{flex-direction:row;flex-wrap:wrap;align-items:center}aside .brand{margin:0 1rem 0 0}aside .spacer,aside small{display:none}main{padding:1rem}}
</style>
</head>
<body>

<section id="login">
  <form id="loginForm">
    <h1 class="brand">Star Pets</h1>
    <p style="margin:0;color:var(--mute)">Sign in to manage your store</p>
    <label for="email">Email</label><input id="email" type="email" required autocomplete="username">
    <label for="password">Password</label><input id="password" type="password" required autocomplete="current-password">
    <p class="err" id="loginErr"></p>
    <button class="btn" style="width:100%">Sign in</button>
    <p style="text-align:center;margin:1rem 0 0"><a href="/" style="color:var(--mute)">Back to store</a></p>
  </form>
</section>

<div id="app" class="hidden">
  <aside>
    <div class="brand">Star Pets</div>
    <button class="nav on" data-tab="dashboard">Dashboard</button>
    <button class="nav" data-tab="products">Products</button>
    <button class="nav" data-tab="orders">Orders</button>
    <div class="spacer"></div>
    <small id="who"></small>
    <a class="nav" href="/" style="color:#cfcaf5;text-decoration:none;padding:.65rem .8rem">View store</a>
    <button class="nav" id="logout">Sign out</button>
  </aside>
  <main>
    <div id="dashboard">
      <h2>Dashboard</h2>
      <div class="stats" id="stats"></div>
      <div class="panel"><b>Low stock (5 or fewer)</b><div id="low"></div></div>
    </div>
    <div id="products" class="hidden">
      <div class="bar"><h2 style="margin:0">Products</h2><button class="btn" id="addProduct">Add product</button></div>
      <div class="panel"><table><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th></th></tr></thead><tbody id="productRows"></tbody></table></div>
    </div>
    <div id="orders" class="hidden">
      <h2>Orders</h2>
      <div class="panel"><table><thead><tr><th>Date</th><th>Customer</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th></tr></thead><tbody id="orderRows"></tbody></table></div>
    </div>
  </main>
</div>

<dialog id="productDialog">
  <form id="productForm">
    <h2 id="dialogTitle" style="margin:0">Add product</h2>
    <label for="pName">Name</label><input id="pName" required>
    <div class="row">
      <div><label for="pCat">Category</label><select id="pCat"><option>Dog</option><option>Cat</option><option>Accessories</option></select></div>
      <div><label for="pPrice">Price (₹)</label><input id="pPrice" type="number" min="0" step="0.01" required></div>
    </div>
    <div>
      <div><label for="pStock">Stock</label><input id="pStock" type="number" min="0" value="0" required></div>
    </div>
    <label for="pImage">Image URL</label><input id="pImage" placeholder="/images/dog-food.jpg">
    <label for="pDesc">Description</label><textarea id="pDesc" rows="3"></textarea>
    <p class="err" id="productErr"></p>
    <div class="actions"><button type="button" class="btn ghost" id="cancelProduct">Cancel</button><button class="btn">Save product</button></div>
  </form>
</dialog>
<div id="toast" class="hidden" role="status"></div>

<script>
const API = '/api/admin';
const STATUSES = ['pending','paid','shipped','delivered','cancelled'];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '₹' + Number(n || 0).toLocaleString('en-IN');
let token = localStorage.getItem('sp_token');
let products = [];
let editingId = null;

async function api(path, method = 'GET', body) {
  const res = await fetch(API + path, {
    method,
    headers: { 'Content-Type': 'application/json', ...(token && { Authorization: 'Bearer ' + token }) },
    body: body && JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && path !== '/login') { logout(); throw new Error(data.error); }
  if (!res.ok) throw new Error(data.error || 'Something went wrong');
  return data;
}
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add('hidden'), 2500);
}

/* auth */
$('loginForm').onsubmit = async e => {
  e.preventDefault(); $('loginErr').textContent = '';
  try {
    const d = await api('/login', 'POST', { email: $('email').value, password: $('password').value });
    token = d.token; localStorage.setItem('sp_token', token); localStorage.setItem('sp_email', d.email);
    start();
  } catch (err) { $('loginErr').textContent = err.message; }
};
function logout() {
  token = null; localStorage.removeItem('sp_token');
  $('app').classList.add('hidden'); $('login').classList.remove('hidden');
}
$('logout').onclick = logout;

/* tabs */
function show(tab) {
  ['dashboard','products','orders'].forEach(t => $(t).classList.toggle('hidden', t !== tab));
  document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  ({ dashboard: loadStats, products: loadProducts, orders: loadOrders })[tab]();
}
document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => show(b.dataset.tab));

/* dashboard */
async function loadStats() {
  const s = await api('/stats');
  $('stats').innerHTML = [
    ['Revenue', money(s.revenue)], ['Orders', s.orders], ['Pending orders', s.pending], ['Products', s.products],
  ].map(([l, v]) => `<div class="stat"><b>${esc(v)}</b><span>${l}</span></div>`).join('');
  $('low').innerHTML = s.lowStock.length
    ? `<table>${s.lowStock.map(p => `<tr><td>${esc(p.name)}</td><td class="low">${p.stock} left</td></tr>`).join('')}</table>`
    : '<div class="empty">All products are well stocked.</div>';
}

/* products */
async function loadProducts() {
  products = await api('/products');
  $('productRows').innerHTML = products.length ? products.map(p => `
    <tr><td>${p.image ? `<img src="${esc(p.image)}" alt="">` : ''}${esc(p.name)}</td>
    <td>${esc(p.category)}</td><td>${money(p.price)}</td>
    <td class="${p.stock <= 5 ? 'low' : ''}">${p.stock}</td>
    <td style="white-space:nowrap"><button class="btn ghost sm" data-edit="${p._id}">Edit</button>
    <button class="btn danger sm" data-del="${p._id}">Delete</button></td></tr>`).join('')
    : '<tr><td colspan="5" class="empty">No products yet. Add your first one.</td></tr>';
}
$('productRows').onclick = async e => {
  const { edit, del } = e.target.dataset;
  if (edit) openProduct(products.find(p => p._id === edit));
  if (del && confirm('Delete this product? This cannot be undone.')) {
    await api('/products/' + del, 'DELETE'); toast('Product deleted'); loadProducts();
  }
};
function openProduct(p) {
  editingId = p?._id || null;
  $('dialogTitle').textContent = p ? 'Edit product' : 'Add product';
  $('pName').value = p?.name || ''; $('pCat').value = p?.category || 'Dog';
  $('pPrice').value = p?.price ?? ''; $('pStock').value = p?.stock ?? 0;
  $('pImage').value = p?.image || '';
  $('pDesc').value = p?.description || ''; $('productErr').textContent = '';
  $('productDialog').showModal();
}
$('addProduct').onclick = () => openProduct();
$('cancelProduct').onclick = () => $('productDialog').close();
$('productForm').onsubmit = async e => {
  e.preventDefault();
  const body = { name: $('pName').value, category: $('pCat').value, price: +$('pPrice').value,
    stock: +$('pStock').value, image: $('pImage').value, description: $('pDesc').value };
  try {
    await (editingId ? api('/products/' + editingId, 'PUT', body) : api('/products', 'POST', body));
    $('productDialog').close(); toast('Product saved'); loadProducts();
  } catch (err) { $('productErr').textContent = err.message; }
};

/* orders */
async function loadOrders() {
  const orders = await api('/orders');
  $('orderRows').innerHTML = orders.length ? orders.map(o => `
    <tr><td>${new Date(o.createdAt).toLocaleDateString('en-IN')}</td>
    <td>${esc(o.customer?.name)}<br><small style="color:var(--mute)">${esc(o.customer?.phone)}<br>${esc(o.customer?.address)}</small></td>
    <td>${(o.items || []).map(i => `${esc(i.name)} × ${i.qty}`).join('<br>')}</td>
    <td>${money(o.total)}</td>
    <td>${esc(o.paymentMethod)}<br><small style="color:var(--mute)">${esc(o.paymentStatus)}</small></td>
    <td><select data-order="${o._id}" aria-label="Order status">${STATUSES.map(s => `<option ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}</select></td></tr>`).join('')
    : '<tr><td colspan="6" class="empty">No orders yet. They will show up here once customers check out.</td></tr>';
}
$('orderRows').onchange = async e => {
  if (!e.target.dataset.order) return;
  await api('/orders/' + e.target.dataset.order, 'PATCH', { status: e.target.value });
  toast('Order updated');
};

function start() {
  $('login').classList.add('hidden'); $('app').classList.remove('hidden');
  $('who').textContent = localStorage.getItem('sp_email') || '';
  show('dashboard');
}
if (token) start();
</script>
</body>
</html>
